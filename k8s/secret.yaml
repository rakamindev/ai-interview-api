# TEMPLATE — fill placeholders then apply with:
#   kubectl apply -f k8s/secret.yaml
#
# Generate values:
#   SECRET_KEY_BASE:  bundle exec rails secret
#   GEMINI_API_KEY:   from Google AI Studio / Vertex AI
#   DB_*:             from Cloud SQL
#   REDIS_URL:        redis://<host>:6379/1
#   SIDEKIQ_*:        choose strong credentials for /sidekiq web UI
#   GCP_CREDENTIALS:  service-account JSON (base64 if using data:, plain if stringData:)
apiVersion: v1
kind: Secret
metadata:
  name: ai-interview-secret
  namespace: default
type: Opaque
stringData:
  SECRET_KEY_BASE: "<bundle exec rails secret>"
  GEMINI_API_KEY: "<rotated-gemini-api-key>"
  DB_USERNAME: "<db-user>"
  DB_PASSWORD: "<db-password>"
  REDIS_URL: "redis://<your-redis-host>:6379/1"
  SIDEKIQ_USERNAME: "<username>"
  SIDEKIQ_PASSWORD: "<strong-password>"
  GCP_CREDENTIALS: |
    <paste service-account JSON here>
